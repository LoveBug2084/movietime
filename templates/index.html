<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; font-weight: bold; }
        html, body {
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            width: 8px;
        }
        html::-webkit-scrollbar-track, body::-webkit-scrollbar-track {
            background: transparent;
        }
        html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            padding: 20px;
            background: linear-gradient(180deg, #000 0%, transparent 100%);
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }
        .search-box {
            width: 100%;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }
        .search-box input {
            flex: 1;
            padding: 15px 20px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: #222;
            color: #fff;
            outline: none;
        }
        .search-box input:focus {
            background: #333;
        }
        .container {
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .pagination button {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            min-width: 45px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .pagination button:hover {
            background: #f40612;
        }
        .pagination button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        .pagination #page-info {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
        }
        .refresh-btn {
            background: #0099ff;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            min-width: 45px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .refresh-btn:hover {
            background: #33aaff;
        }
        .folder-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            min-width: 45px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            margin-left: 10px;
            transition: background 0.15s;
        }
        .folder-btn:hover {
            background: #555;
        }
        .sort-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 20px;
        }
        .sort-bar label {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
        }
        .sort-bar select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
        }
        .sort-bar select:hover {
            background: #333;
        }
        .sort-bar select:focus {
            border-color: #666;
        }
        .sort-bar select::-webkit-scrollbar {
            width: 8px;
        }
        .sort-bar select::-webkit-scrollbar-track {
            background: transparent;
        }
        .sort-bar select::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .movie-card {
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
        }
        .movie-card:hover {
            transform: scale(1.05);
        }
        .movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #333;
        }
        .movie-card .info {
            padding: 10px;
        }
        .movie-card .title {
            font-size: 14px;
            font-weight: bold;
            white-space: normal;
            word-wrap: break-word;
            overflow: visible;
        }
        .movie-card .year-rating {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }
        .movie-card .year-rating .year-value {
            color: #fff;
            font-weight: bold;
        }
        .movie-card .year-rating .rating-value {
            color: #f1c40f;
            font-weight: bold;
        }
        .movie-card .stars {
            font-size: 12px;
            margin-bottom: 5px;
        }
        .movie-card .stars .star.filled {
            color: #2ecc71;
        }
        .movie-card .stars .star {
            color: #444;
        }
        .movie-card .seeders {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .movie-card .resolution {
            font-size: 12px;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 3px;
        }
        .movie-card .resolution-list {
            display: none;
            flex-direction: column;
            gap: 2px;
            margin-top: 5px;
            max-height: 110px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
            pointer-events: auto;
            position: relative;
            z-index: 30;
        }
        .movie-card .resolution-list::-webkit-scrollbar {
            width: 8px;
        }
        .movie-card .resolution-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .movie-card .resolution-list::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        .movie-card .resolution-list.visible {
            display: flex;
        }
        .movie-card .resolution-item {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto auto;
            gap: 2px 8px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 12px;
            user-select: none;
            -webkit-user-select: none;
        }
        .movie-card .resolution-item:hover {
            background: #006699;
        }
        .movie-card .resolution-item:active {
            background: #004d73;
        }
        .movie-card .resolution-item .res-label {
            grid-column: 1;
            grid-row: 1;
        }
        .movie-card .resolution-item .res-seeders {
            grid-column: 2;
            grid-row: 1;
            text-align: right;
        }
         .movie-card .resolution-item .res-size {
             grid-column: 1;
             grid-row: 2;
         }
         .movie-card .resolution-item .res-progress {
             grid-column: 2;
             grid-row: 2;
             text-align: right;
             color: #0099ff;
         }
         .movie-card .resolution-item:hover {

            background: #006699;
        }
        .movie-card .resolution-item .res-label {
            color: #2ecc71;
            font-weight: bold;
        }
        .movie-card .resolution-item .res-seeders {
            color: #888;
            font-size: 11px;
        }
        .movie-card .torrent-status {
            font-size: 12px;
            margin-top: 5px;
        }
        .movie-card .torrent-status.searching {
            color: #2ecc71;
        }
        .movie-card .torrent-status.error {
            color: #e50914;
        }
        .movie-card .download-bar {
            display: none;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
            padding: 4px 8px;
            background: rgba(0,0,0,0.85);
            border-radius: 0 0 8px 8px;
        }
        .movie-card.downloading .download-bar,
        .movie-card.playable .download-bar {
            display: flex;
        }
        .movie-card .download-bar .dl-progress-track {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .movie-card .download-bar .dl-progress-track .dl-progress-fill {
            height: 100%;
            background: #2ecc71;
            border-radius: 5px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .movie-card .download-bar .dl-progress-track .dl-progress-fill.header-stage {
            background: #ff9900;
        }
        .movie-card .download-bar .dl-progress-track .dl-percent-text {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px #000;
        }
        .movie-card .download-bar .dl-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .movie-card .download-bar .dl-buttons .dl-cancel {
            background: #444;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .movie-card .download-bar .dl-buttons .dl-cancel:hover {
            background: #e50914;
        }
        .movie-card .download-bar .dl-buttons .dl-play {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            visibility: visible;
            opacity: 0.4;
            pointer-events: none;
        }
        .movie-card .download-bar .dl-buttons .dl-play:hover {
            background: #ff3333;
        }
        .movie-card .download-bar .dl-buttons .dl-play.ready {
            opacity: 1;
            pointer-events: auto;
        }
        .movie-card .poster-container {
            position: relative;
        }
        .movie-card .description {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #ccc;
            opacity: 0;
            transition: opacity 0.2s;
            overflow-y: auto;
            border-radius: 8px 8px 0 0;
            z-index: 10;
            display: flex;
            align-items: flex-start;
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
        }
        .movie-card .description::-webkit-scrollbar {
            width: 8px;
        }
        .movie-card .description::-webkit-scrollbar-track {
            background: transparent;
        }
        .movie-card .description::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        .movie-card:hover .description {
            opacity: 1;
        }
        .placeholder-thumb {
            width: 100%;
            padding-top: 150%;
            background: #333;
            position: relative;
        }
        .placeholder-thumb::after {
            content: '🎬';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
        }
        .notification {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #e50914;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            z-index: 400;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .notification.visible {
            opacity: 1;
        }
        </style>
</head>

    <script>
        let currentMovies = [];
        let displayMovies = [];
        let currentPage = 1;
        let currentSource = 'popular';
        let currentSearchQuery = '';
        let currentTotalPages = 1;
        let currentSearchId = null;
        let currentSearchRequestId = 0;
        let searchResultsCache = [];
        let viewMode = 'all'; // 'all' or 'downloaded'
        let libraryMovies = [];
 
 
        let searchPollInterval = null;

        let torrentCache = {};
        let hoverTimeouts = {};
        let pendingFetches = {};
        let downloadPollInterval = null;
        const HEADER_MIN_SIZE = 100 * 1024 * 1024; // 100MB
        let popularLoaded = false;
        let totalDatabaseMovies = 0;
        let lastTotalMovies = 0;
        
        async function refreshDatabase() {
            document.getElementById('movie-count').textContent = 'Loading...';
            popularLoaded = false;
            await loadAll(1);
            
            const query = searchInput.value.trim();
            if (query) {
                performSearch(query);
            }
        }

        const grid = document.getElementById('grid');
        const searchInput = document.getElementById('search');
        const notification = document.getElementById('notification');
        const pageInfo = document.getElementById('page-info');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const ratingSelect = document.getElementById('rating-select');
        const genreSelect = document.getElementById('genre-select');
        const yearSelect = document.getElementById('year-select');
        let currentGenre = '';
        let currentRating = '';
        let currentYear = '';
        let currentCategory = 'all';
        let activeCard = null;

        function showNotification(msg, isError = false) {
            notification.textContent = msg;
            notification.classList.add('visible');
            setTimeout(() => notification.classList.remove('visible'), 10000);
        }
        
        function handleGenreChange() {
            currentGenre = genreSelect.value;
            applyCurrentView();
        }
        
        function handleYearChange() {
            currentYear = yearSelect.value;
            applyCurrentView();
        }

        
        function handleRatingChange() {
            currentRating = ratingSelect.value;
            applyCurrentView();
        }
        
        async function toggleViewMode() {
            const btn = document.getElementById('view-toggle-btn');
            if (viewMode === 'all') {
                viewMode = 'downloaded';
                btn.textContent = '📚 Library';
                btn.style.background = '#0099ff';
                
                if (libraryMovies.length === 0) {
                    await loadDownloadedMovies();
                } else {
                    applyCurrentView();
                }
            } else {
                viewMode = 'all';
                btn.textContent = '📚 All';
                btn.style.background = '#333';
                applyCurrentView();
            }
        }

        async function loadDownloadedMovies() {
            try {
                const resp = await fetch('/api/downloads/list');
                const movies = await resp.json();
                libraryMovies = movies || [];
                applyCurrentView();
            } catch (e) {
                console.error('Error loading library:', e);
                showNotification('Error loading library', true);
            }
        }

        function applyCurrentView() {
            if (viewMode === 'downloaded') {
                const filtered = sortAndFilterMovies(libraryMovies, currentSearchQuery);
                renderMovies(filtered, 'downloaded');
                
                const MOVIES_PER_PAGE = 100;
                currentTotalPages = Math.max(1, Math.ceil(filtered.length / MOVIES_PER_PAGE));
                currentPage = 1;
                updatePagination(currentTotalPages);
                document.getElementById('movie-count').textContent = filtered.length.toLocaleString() + ' Downloaded Movies';
            } else {
                if (currentSearchQuery) {
                    performSearch(currentSearchQuery, currentPage);
                } else {
                    loadAll(currentPage);
                }
            }
        }
        
        function sortAndFilterMovies(movies, query) {
            let result = [...movies];
            
            if (currentGenre) {
                const genreId = parseInt(currentGenre);

                        updateCardWithTorrent(card, torrentCache[key]);
                        return;
                    }
                    
                    if (pendingFetches[key]) {
                        return;
                    }
                    
                const loadingEl = card.querySelector('.torrent-status');
                if (loadingEl) {
                    loadingEl.textContent = 'Searching...';
                    loadingEl.className = 'torrent-status searching';
                }
                
                pendingFetches[key] = true;
                const tmdbId = movie.id || '';
                fetch(`/api/torrent?q=${encodeURIComponent(title)}&category=${currentCategory}&year=${encodeURIComponent(year || '')}&tmdb_id=${encodeURIComponent(tmdbId)}`)
                    .then(resp => {

                            if (loadingEl) {
                                loadingEl.textContent = 'No torrents';
                                loadingEl.className = 'torrent-status error';
                            }
                            pendingFetches[key] = false;
                            return;

                        return resp.json();

                    .then(data => {

                        if (data && data.length > 0) {

                    .catch(() => {
                        pendingFetches[key] = false;

                        }
                    });

        async function loadDownloads() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();

                // Reset all download bars
                document.querySelectorAll('.movie-card').forEach(card => {
                    const fill = card.querySelector('.dl-progress-fill');
                    const text = card.querySelector('.dl-percent-text');
                    if (fill) fill.style.width = '0%';
                    if (text) text.textContent = '';
                });

                if (data.status === 'downloading' && data.info_hash) {
                    const activeCardEl = document.querySelector(`.movie-card[data-info-hash="${data.info_hash}"]`);
                    if (!activeCardEl) {
                        // Try with dataset
                        const cards = document.querySelectorAll('.movie-card');
                        for (const c of cards) {
                            if (c.dataset.infoHash === data.info_hash) {
                                // Found it - apply two-stage progress logic
                                const downloaded = data.downloaded_size || 0;
                                let displayPercent;
                                if (downloaded < HEADER_MIN_SIZE) {
                                    displayPercent = Math.min(100, Math.floor((downloaded / HEADER_MIN_SIZE) * 100));
                                } else {
                                    const fileSize = parseInt(data.total_size);
                                    if (!fileSize) break;
                                    displayPercent = Math.min(100, Math.floor((downloaded / fileSize) * 100));
                                }
                                const fill = c.querySelector('.dl-progress-fill');
                                const text = c.querySelector('.dl-percent-text');
                                if (fill) {
                                    if (downloaded < HEADER_MIN_SIZE) {
                                        fill.classList.add('header-stage');
                                    } else {
                                        fill.classList.remove('header-stage');
                                    }
                                    fill.style.width = displayPercent + '%';
                                }
                                if (text) text.textContent = displayPercent + '%';
                                break;
                            }
                        }
                    }
                }
            } catch (e) {}
        }

        async function checkDownload(card, expectedInfoHash) {
            if (!document.body.contains(card)) {
                if (downloadPollInterval) {
                    clearInterval(downloadPollInterval);
                    downloadPollInterval = null;
                }
                return;

            const percentText = card.querySelector('.dl-percent-text');
            const dlPlay = card.querySelector('.dl-play');

            if (data.status === 'ready') {
                progressFill.style.width = '100%';
                percentText.textContent = '100%';

                console.log('Ready to play, downloaded:', data.downloaded_size || 'unknown');

                card.classList.add('playable');
                dlPlay.classList.add('ready');

                // Update resolution list progress for this hash
                const readyItems = card.querySelectorAll(`.resolution-item[data-info-hash="${expectedInfoHash}"]`);
                readyItems.forEach(item => {
                    const progEl = item.querySelector('.res-progress');
                    if (progEl) progEl.textContent = '100%';
                    item.title = 'Ready to play';
                });

                if (downloadPollInterval) {
                    clearInterval(downloadPollInterval);
                    downloadPollInterval = null;
                }

                if (!isStreaming) {
                    isStreaming = true;
                    startPlayback(expectedInfoHash);
                }
            } else if (data.status === 'error') {
                if (downloadPollInterval) {
                    clearInterval(downloadPollInterval);
                    downloadPollInterval = null;
                }
                percentText.textContent = 'Error';
            } else if (data.downloaded_size !== undefined) {
                const downloaded = data.downloaded_size;
                const isValid = data.is_valid;

                let displayPercent;
                if (downloaded < HEADER_MIN_SIZE) {
                    // Stage 1: Show progress toward 100MB threshold
                    displayPercent = Math.min(100, Math.floor((downloaded / HEADER_MIN_SIZE) * 100));
                    progressFill.classList.add('header-stage');
                } else {
                    // Stage 2: Show actual download progress relative to video file size
                    const fileSize = parseInt(data.total_size);
                    if (!fileSize) return;
                    displayPercent = Math.min(100, Math.floor((downloaded / fileSize) * 100));
                    progressFill.classList.remove('header-stage');
                }

                percentText.textContent = displayPercent + '%';
                progressFill.style.width = displayPercent + '%';

                // Update resolution list progress for this hash
                const dlItems = card.querySelectorAll(`.resolution-item[data-info-hash="${expectedInfoHash}"]`);
                dlItems.forEach(item => {
                    const progEl = item.querySelector('.res-progress');
                    if (progEl) progEl.textContent = displayPercent + '%';
                });

                // Check playable status via backend API (100MB + header ready)
                if (!isStreaming) {
                    const playableResp = await fetch('/api/download/playable');
                    const playableData = await playableResp.json();
                    if (playableData.playable && isValid) {
                        card.classList.add('playable');
                        isStreaming = true;
                        dlPlay.classList.add('ready');
                        startPlayback(expectedInfoHash);
                    }
                }
            } else {
                percentText.textContent = 'Starting...';
            }
        }

        async function startPlaybackFromCard(event) {
            const card = event.target.closest('.movie-card');
            if (!card) return;
            const hash = card.dataset.infoHash;
            if (hash) {
                card.classList.add('playable');
                card.querySelector('.dl-play').classList.add('ready');
                startPlayback(hash);
            } else if (card._playMovie) {
                card._playMovie();
            }
        }
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }
        
        async function startPlayback(infoHash) {
            isStreaming = true;
            // Trigger UI progress polling
            const card = document.querySelector(`.movie-card[data-info-hash="${infoHash}"]`);
            if (card) {
                if (activeCard && activeCard !== card) {
                    activeCard.classList.remove('downloading');
                    activeCard.classList.remove('playable');
                }
                activeCard = card;
                card.classList.add('downloading');
                if (downloadPollInterval) clearInterval(downloadPollInterval);
                downloadPollInterval = setInterval(() => checkDownload(card, infoHash), 2000);
            }

            try {
                const resp = await fetch('/api/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({info_hash: infoHash})
                });
                const data = await resp.json();
                
                if (!resp.ok) {
                    showNotification(data.error, true);
                } else {
                    checkPlayable();
                }
            } catch (e) {
                showNotification('Playback error: ' + e.message, true);
            }
        }
        
        async function checkPlayable() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();

                if (data.status === 'ready' || data.status === 'downloading') {
                    // Remove playable class and play button from all cards first
                    document.querySelectorAll('.movie-card.playable').forEach(c => {
                        c.classList.remove('playable');
                        const btn = c.querySelector('.dl-play');
                        if (btn) btn.classList.remove('ready');
                    });

                    if (data.info_hash) {
                        const cards = document.querySelectorAll('.movie-card');
                        cards.forEach(card => {
                            if (card.dataset.infoHash === data.info_hash) {
                                card.classList.add('playable');
                                const btn = card.querySelector('.dl-play');
                                if (btn) btn.classList.add('ready');
                            }
                        });
                    }
                }
            } catch (e) {}
        }
        
        // Expose pyqt object to JS
        window.pyqt = null;
        
        async function cancelDownload() {
            await fetch('/api/play/stop', { method: 'POST' }).catch(() => {});
            if (downloadPollInterval) {
                clearInterval(downloadPollInterval);
                downloadPollInterval = null;
            }
            if (activeCard) {
                activeCard.classList.remove('downloading');
                activeCard.classList.remove('playable');
                const btn = activeCard.querySelector('.dl-play');
                if (btn) btn.classList.remove('ready');
                activeCard = null;
            }
            isStreaming = false;
        }
        
        // Search functionality
        let searchTimeout;
        
        function cancelCurrentSearch() {
            if (searchPollInterval) {
                clearInterval(searchPollInterval);
                searchPollInterval = null;
            }
            if (currentSearchId) {
                fetch('/api/search/cancel', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({search_id: currentSearchId})
                }).catch(() => {});
                currentSearchId = null;
            }
            searchResultsCache = [];
        }
        
        function pollSearchProgress() {
            if (!currentSearchId) return;
            
            searchPollInterval = setInterval(() => {
                fetch(`/api/search/progress?id=${currentSearchId}`)
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.cancelled) {
                            if (searchPollInterval) clearInterval(searchPollInterval);
                            searchPollInterval = null;
                            currentSearchId = null;
                            return;
                        }
                        
                        // Update cache with any new results
                        if (data.combined && data.combined.length > searchResultsCache.length) {
                            searchResultsCache = [...data.combined];
                        }
                        
                        // Calculate total pages from filtered results
                        let filteredCache = searchResultsCache;
                        if (currentGenre) {
                            const genreId = parseInt(currentGenre);
                            filteredCache = searchResultsCache.filter(m => !m.genre_ids || m.genre_ids.includes(genreId));
                        }
                        const MOVIES_PER_PAGE = 100;
                        currentTotalPages = Math.max(1, Math.ceil(filteredCache.length / MOVIES_PER_PAGE));
                        
                        // Enable next button only if more pages have been fetched
                        const nextBtn = document.getElementById('next-btn');
                        if (nextBtn) {
                            nextBtn.disabled = currentPage >= data.pages_fetched || currentPage >= currentTotalPages;
                        }
                        
                        // Update page info display
                        const pageInfo = document.getElementById('page-info');
                        if (pageInfo) {
                            pageInfo.textContent = `Page ${currentPage} of ${currentTotalPages}`;
                        }
                        
                        if (data.done) {
                            if (searchPollInterval) clearInterval(searchPollInterval);
                            searchPollInterval = null;
                            currentSearchId = null;
                        }
                    })
                    .catch(() => {});
            }, 500);
        }
        
        function performSearch(query, page = 1) {
            if (!query) {
                loadAll(page);
                return;
            }

            if (viewMode === 'downloaded') {
                const filtered = sortAndFilterMovies(libraryMovies, query);
                renderMovies(filtered, 'search');
                updatePagination(1);
                document.getElementById('movie-count').textContent = filtered.length.toLocaleString() + ' Downloaded Movies';
                return;
            }

            // Always show pagination
            const pagination = document.getElementById('pagination');
            pagination.style.display = 'flex';
            
            // Cancel any existing streaming search
            cancelCurrentSearch();
            
            if (!query) {
                loadAll(1);
                return;
            }
            
            currentSearchQuery = query;
            currentSource = 'search';
            
            // 1. Instant Local Search
            const queryLower = query.toLowerCase();
            const localMatches = displayMovies.filter(m => 
                (m.title || '').toLowerCase().includes(queryLower)
            );
            
            // Apply current filters to local matches
            const filteredLocal = sortAndFilterMovies(localMatches, query);
            
            const MOVIES_PER_PAGE = 100;
            const pageLocal = filteredLocal.slice(0, MOVIES_PER_PAGE);
            
            // Render local results immediately
            renderMovies(pageLocal, 'search');
            
            const totalLocalPages = Math.max(1, Math.ceil(filteredLocal.length / MOVIES_PER_PAGE));
            currentPage = 1;
            updatePagination(totalLocalPages);
            document.getElementById('movie-count').textContent = filteredLocal.length.toLocaleString() + ' of ' + totalDatabaseMovies.toLocaleString() + ' Movies';
            
            // 2. Background External Search
            const requestId = ++currentSearchRequestId;
            
            fetch(`/api/search?q=${encodeURIComponent(query)}&page=${page}&external_only=1&year=${encodeURIComponent(currentYear)}`)
                .then(resp => resp.json())
                .then(data => {
                    if (requestId !== currentSearchRequestId) return;
                    
                     const externalResults = data.combined || data.results || [];
                     
                     // Combine local and external results without deduplication
                     const finalResults = [...filteredLocal, ...externalResults];
                     
                     // Update cache for pagination

                    searchResultsCache = finalResults;
                    
                    const totalPages = Math.max(1, Math.ceil(finalResults.length / MOVIES_PER_PAGE));
                    currentTotalPages = totalPages;
                    
                    const pageResults = finalResults.slice(0, MOVIES_PER_PAGE);
                    renderMovies(pageResults, 'search');
                    updatePagination(totalPages);
                    
                    document.getElementById('movie-count').textContent = finalResults.length.toLocaleString() + ' of ' + totalDatabaseMovies.toLocaleString() + ' Movies';
                    
                    if (data.streaming && data.search_id) {
                        currentSearchId = data.search_id;
                        if (!data.done) {
                            pollSearchProgress();
                        }
                    }
                })
                .catch(err => console.error('Search error:', err));
        }
        
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            currentSearchQuery = query;
 
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (query.length < 2) {
                    cancelCurrentSearch();
                    applyCurrentView();
                    return;
                }
                applyCurrentView();
            }, 400);
        });

        
        // Load all movies on start
        loadAll();
        
        async function openDownloadsFolder() {
            try {
                const resp = await fetch('/api/open-downloads', { method: 'POST' });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    console.error('Failed to open downloads folder:', err);
                }
            } catch (e) {
                console.error('Open downloads error:', e);
            }
        }
        // Initialize
        loadAll();
        loadDownloadedMovies();
    </script>
</body>
