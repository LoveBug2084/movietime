<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; font-weight: bold; }
        html, body {
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
        }
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            width: 12px;
        }
        html::-webkit-scrollbar-track, body::-webkit-scrollbar-track {
            background: transparent;
        }
        html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }
        .header {
            padding: 20px;
            background: linear-gradient(180deg, #000 0%, transparent 100%);
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
        }
        .search-box {
            width: 100%;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: nowrap;
        }
        .search-box input {
            flex: 1;
            padding: 15px 20px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background: #222;
            color: #fff;
            outline: none;
        }
        .search-box input:focus {
            background: #333;
        }
        .container {
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .pagination button {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            min-width: 45px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .pagination button:hover {
            background: #f40612;
        }
        .pagination button:disabled {
            background: #333;
            cursor: not-allowed;
        }
        .pagination #page-info {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
        }
        .loading-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .loading-bg.visible {
            display: block;
        }
        .loading-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e50914;
            border: none;
            color: #fff;
            padding: 10px 25px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1000;
            display: none;
            pointer-events: none;
        }
        .loading-overlay.visible {
            display: inline-flex;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.visible {
            display: flex;
        }
        .modal-box {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            min-width: 300px;
            text-align: center;
            color: #fff;
            font-size: 16px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 8px; right: 10px;
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .modal-close:hover { color: #fff; }
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        .modal-buttons button {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 8px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .modal-buttons button:hover { background: #f40612; }
        .modal-buttons button:last-child {
            background: #333;
        }
        .modal-buttons button:last-child:hover { background: #444; }
        .refresh-btn {
            background: #0099ff;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            min-width: 45px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .refresh-btn:hover {
            background: #33aaff;
        }
        .folder-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 0 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            min-width: 45px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            margin-left: 10px;
            transition: background 0.15s;
        }
        .folder-btn:hover {
            background: #555;
        }
        .sort-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 20px;
        }
        .sort-bar label {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
        }
        .sort-bar select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
        }
        .sort-bar select:hover {
            background: #333;
        }
        .sort-bar select:focus {
            border-color: #666;
        }
        .sort-bar select::-webkit-scrollbar {
            width: 12px;
        }
        .sort-bar select::-webkit-scrollbar-track {
            background: transparent;
        }
        .sort-bar select::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
        }
        .movie-card {
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
        }
        .movie-card:hover {
            transform: scale(1.05);
        }
        .movie-card img {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #333;
        }
        .movie-card .info {
            padding: 10px;
        }
        .movie-card .title {
            font-size: 14px;
            font-weight: bold;
            white-space: normal;
            word-wrap: break-word;
            overflow: visible;
        }
        .movie-card .year-rating {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
        }
        .movie-card .year-rating .year-value {
            color: #fff;
            font-weight: bold;
        }
        .movie-card .year-rating .rating-value {
            color: #f1c40f;
            font-weight: bold;
        }
        .movie-card .stars {
            font-size: 12px;
            margin-bottom: 5px;
        }
        .movie-card .stars .star.filled {
            color: #2ecc71;
        }
        .movie-card .stars .star {
            color: #444;
        }
        .movie-card .seeders {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .movie-card .resolution {
            font-size: 12px;
            color: #2ecc71;
            font-weight: bold;
            margin-top: 3px;
        }
        .movie-card .resolution-list {
            display: none;
            flex-direction: column;
            gap: 2px;
            margin-top: 5px;
            max-height: 110px;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
            pointer-events: auto;
            position: relative;
            z-index: 30;
        }
        .movie-card .resolution-list::-webkit-scrollbar {
            width: 12px;
        }
        .movie-card .resolution-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .movie-card .resolution-list::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        .movie-card .resolution-list.visible {
            display: flex;
        }
        .movie-card .resolution-item {
            display: grid;
            min-width: 0;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto auto auto;
            gap: 0 8px;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 12px;
            user-select: none;
            -webkit-user-select: none;
        }
        .movie-card .resolution-item:hover {
            background: #444;
        }
        .movie-card .resolution-item:active {
            background: #333;
        }
        .movie-card .resolution-item .res-label {
            grid-column: 1;
            grid-row: 1;
        }
        .movie-card .resolution-item .res-seeders {
            grid-column: 2;
            grid-row: 1;
            text-align: right;
        }
         .movie-card .resolution-item .res-size {
             grid-column: 1;
             grid-row: 2;
         }
         .movie-card .resolution-item .res-progress {
             grid-column: 2;
             grid-row: 2;
             text-align: right;
             color: #0099ff;
         }
         .movie-card .resolution-item .res-progress-track {
             grid-column: 1 / -1;
             grid-row: 3;
             height: 3px;
             background: #222;
             border-radius: 2px;
             overflow: hidden;
             margin-top: 1px;
         }
         .movie-card .resolution-item .res-progress-track .res-progress-fill {
             height: 100%;
             border-radius: 2px;
             width: 0%;
             transition: width 0.3s ease;
             background: #2ecc71;
         }
         .movie-card .resolution-item .res-progress-track .res-progress-fill.phase1 {
             background: #ff8c00;
         }
          .movie-card .resolution-item:hover {
            background: #444;
        }
        .movie-card .resolution-item [data-tooltip] {
            position: relative;
        }
        .movie-card .resolution-item [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #ddd;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .movie-card .resolution-item .res-label {
            color: #ffff00;
            font-weight: bold;
        }
        .movie-card .resolution-item .res-seeders {
            color: #888;
            font-size: 11px;
        }
        .movie-card .torrent-status {
            font-size: 12px;
            margin-top: 5px;
        }
        .movie-card .torrent-status.searching {
            color: #2ecc71;
        }
        .movie-card .torrent-status.error {
            color: #e50914;
        }
        .movie-card .download-bar {
            display: none;
            gap: 4px;
            margin-top: 4px;
            padding: 4px 8px;
            background: rgba(0,0,0,0.85);
            border-radius: 0 0 8px 8px;
        }
        .movie-card.downloading .download-bar,
        .movie-card.playable .download-bar {
            display: flex;
        }
        .movie-card .download-bar .dl-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .movie-card .download-bar .dl-buttons .dl-cancel {
            background: #444;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }
        .movie-card .download-bar .dl-buttons .dl-cancel:hover {
            background: #e50914;
        }
        .movie-card .download-bar .dl-buttons .dl-play {
            background: #e50914;
            border: none;
            color: #fff;
            padding: 4px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            visibility: visible;
            opacity: 0.4;
            pointer-events: none;
        }
        .movie-card .download-bar .dl-buttons .dl-play:hover {
            background: #ff3333;
        }
        .movie-card .download-bar .dl-buttons .dl-play.ready {
            opacity: 1;
            pointer-events: auto;
        }
        .movie-card .poster-container {
            position: relative;
        }
        .movie-card .description {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #ccc;
            opacity: 0;
            transition: opacity 0.2s;
            overflow-y: auto;
            border-radius: 8px 8px 0 0;
            z-index: 10;
            display: flex;
            align-items: flex-start;
            scrollbar-width: thin;
            scrollbar-color: #0099ff transparent;
        }
        .movie-card .description::-webkit-scrollbar {
            width: 12px;
        }
        .movie-card .description::-webkit-scrollbar-track {
            background: transparent;
        }
        .movie-card .description::-webkit-scrollbar-thumb {
            background: #0099ff;
            border-radius: 4px;
        }
        .movie-card:hover .description {
            opacity: 1;
        }
        .placeholder-thumb {
            width: 100%;
            padding-top: 150%;
            background: #333;
            position: relative;
        }
        .placeholder-thumb::after {
            content: '🎬';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
        }
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e50914;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            z-index: 400;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .notification.visible {
            opacity: 1;
        }
        </style>
</head>

        let currentMovies = [];

                            const resp = await fetch('/api/download/delete/hash/' + hash, { method: 'DELETE' });

        function applyCurrentView() {
            if (viewMode === 'downloaded') {
                let filtered = sortAndFilterMovies(libraryMovies, currentSearchQuery);
                renderMovies(filtered, 'downloaded');
                
                const MOVIES_PER_PAGE = 100;
                currentTotalPages = Math.max(1, Math.ceil(filtered.length / MOVIES_PER_PAGE));
                currentPage = 1;
                updatePagination(currentTotalPages);
                document.getElementById('movie-count').textContent = filtered.length.toLocaleString() + ' Downloaded Movies';
            } else {
                if (currentSearchQuery) {
                    performSearch(currentSearchQuery, currentPage);
                } else {
                    loadAll(currentPage);
                }
            }
        }
        
        function sortAndFilterMovies(movies, query) {
            let result = [...movies];
            
            if (currentGenre) {
                const genreId = parseInt(currentGenre);
                result = result.filter(m => !m.genre_ids || m.genre_ids.includes(genreId));
            }
            
            if (currentRating) {
                if (currentRating === 'none') {
                    result = result.filter(m => !m.rating || m.rating === 'None' || m.rating === 0);
                } else {
                    const minRating = parseFloat(currentRating);
                    result = result.filter(m => m.rating && m.rating >= minRating);
                }
            }
            
            if (currentYear) {
                const year = parseInt(currentYear);
                result = result.filter(m => m.year && parseInt(m.year) === year);
            }
            
            if (query) {
                result = result.filter(m => 
                    (m.title || '').toLowerCase().includes(query.toLowerCase())
                );
            }
            
            return result;
        }

        function getMovieUniqueKey(m) {

                    // Add to cardMap

                grid.appendChild(card);

            // Re-enable progress polling on the new card if a download was in progress

            loadDownloads();

        function updateCardWithTorrent(card, torrents) {
            const loadingEl = card.querySelector('.torrent-status');
            const listEl = card.querySelector('.resolution-list');
            if (!listEl) return;
            
            if (torrents.length === 0) {
                if (loadingEl) {
                    loadingEl.textContent = 'No torrents';
                    loadingEl.className = 'torrent-status error';
                }
                listEl.innerHTML = '';
                listEl.classList.remove('visible');
                return;
            }
            
            if (loadingEl) loadingEl.textContent = '';

            const seedersEl = card.querySelector('.seeders');
            if (seedersEl) seedersEl.style.display = 'none';

            const resEl = card.querySelector('.resolution');
            if (resEl) resEl.style.display = 'none';

            const movieId = card.dataset.movieId;
            const localReady = {};
            if (movieId) {
                const libMovie = libraryMovies.find(m => String(m.id) === String(movieId));
                if (libMovie && libMovie.resolutions) {
                    libMovie.resolutions.forEach(r => {
                        if (r.progress >= 100 && r.is_playable) localReady[r.info_hash] = true;
                    });
                }
            }

            listEl.innerHTML = '';
            let anyPlayable = false;
            const activeItem = activeCard ? activeCard.querySelector('.resolution-item') : null;
            const activeHash = activeItem ? activeItem.dataset.infoHash : null;
            torrents.sort((a, b) => {
                const aActive = a.info_hash && activeHash && a.info_hash === activeHash ? 1 : 0;
                const bActive = b.info_hash && activeHash && b.info_hash === activeHash ? 1 : 0;
                if (aActive !== bActive) return bActive - aActive;
                const aPlayable = a.is_playable ? 1 : 0;
                const bPlayable = b.is_playable ? 1 : 0;
                if (aPlayable !== bPlayable) return bPlayable - aPlayable;
                const aProg = parseInt(a.progress || 0, 10);
                const bProg = parseInt(b.progress || 0, 10);
                if (aProg !== bProg) return bProg - aProg;
                const aSeed = typeof a.seeders === 'number' ? a.seeders : 0;
                const bSeed = typeof b.seeders === 'number' ? b.seeders : 0;
                if (aSeed !== bSeed) return bSeed - aSeed;
                const aRes = resolutionRank(a.resolution);
                const bRes = resolutionRank(b.resolution);
                return bRes - aRes;
            });
            torrents.forEach(torrent => {
                const item = document.createElement('div');
                item.className = 'resolution-item';
                item.dataset.infoHash = torrent.info_hash || '';
                
                const label = document.createElement('span');
                label.className = 'res-label';
                const src = torrent.source || '';
                label.textContent = (src ? src + ' ' : '') + (torrent.resolution || 'N/A');
                
                const size = document.createElement('span');
                size.className = 'res-size';
                const sizeBytes = parseInt(torrent.size || 0, 10);
                size.textContent = sizeBytes > 0 ? formatSize(sizeBytes) : '';
                
                 const seeders = document.createElement('span');
                 seeders.className = 'res-seeders';
                 const ih = torrent.info_hash || '';
                 const s = (localReady[ih]) ? 'Ready' : torrent.seeders;
                 seeders.textContent = typeof s === 'number' ? `${s} seeders` : (s || '');
                 
                  const progress = parseInt(torrent.progress || 0, 10);
                  const progressEl = document.createElement('span');
                  progressEl.className = 'res-progress';
                  if (progress > 0) {
                      progressEl.textContent = `${progress}%`;
                  } else {
                      progressEl.textContent = '';
                  }
                  
                  const progressTrack = document.createElement('div');
                  progressTrack.className = 'res-progress-track';
                  const progressFill = document.createElement('div');
                  progressFill.className = 'res-progress-fill' + (progress >= 100 ? ' completed' : '');
                  progressFill.style.width = progress + '%';
                  progressTrack.appendChild(progressFill);
                  
                  item.appendChild(label);
                  item.appendChild(size);
                  item.appendChild(seeders);
                  item.appendChild(progressEl);
                  item.appendChild(progressTrack);

                 
                 if (torrent.is_playable) {
                    anyPlayable = true;
                    item.title = 'Ready to play';
                }

                item.onclick = (e) => {
                    e.stopPropagation();
                    if (torrent.is_playable) {
                        startPlayback(torrent.info_hash);
                    } else {
                        startTorrent(torrent, card);
                    }
                };

                item.dataset.torrentName = torrent.name || '';
                if (card.dataset.source === 'downloaded') {
                    item.oncontextmenu = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const movie = libraryMovies.find(m => m.id === parseInt(card.dataset.movieId));
                        if (movie) showDeleteTorrentConfirm(card, item, movie);
                    };
                }
                
                listEl.appendChild(item);
            });
            listEl.classList.add('visible');
            if (anyPlayable) {
                card.classList.add('playable');
                const btn = card.querySelector('.dl-play');
                if (btn) btn.classList.add('ready');

        }
        
        function setupTorrentHover(card, movie) {

            const year = movie.year || '';
            const key = getMovieUniqueKey(movie);

            if (hoverTimeouts[key]) {
                clearTimeout(hoverTimeouts[key]);
            }
            
                hoverTimeouts[key] = setTimeout(() => {
                    if (torrentCache[key] && torrentCache[key].length > 0 && torrentCache[key][0].size !== undefined) {
                        updateCardWithTorrent(card, torrentCache[key]);
                        return;
                    }
                    
                    if (pendingFetches[key]) {
                        return;
                    }
                    
                const loadingEl = card.querySelector('.torrent-status');
                if (loadingEl) {
                    loadingEl.textContent = 'Searching...';
                    loadingEl.className = 'torrent-status searching';
                }
                
                pendingFetches[key] = true;
                const tmdbId = movie.id || '';
                fetch(`/api/torrent?q=${encodeURIComponent(title)}&category=${currentCategory}&year=${encodeURIComponent(year || '')}&tmdb_id=${encodeURIComponent(tmdbId)}`)
                    .then(resp => {

                            pendingFetches[key] = false;
                            return;

                        return resp.json();

                    .then(data => {

        async function loadDownloads() {
            try {
                const resp = await fetch('/api/status');
                const data = await resp.json();

                if ((data.status === 'downloading' || data.status === 'ready') && data.info_hash) {
                    const cards = document.querySelectorAll('.movie-card');
                    for (const c of cards) {
                        if (c.querySelector(`.resolution-item[data-info-hash="${data.info_hash}"]`)) {
                            const downloaded = data.downloaded_size || 0;
                            let displayPercent;
                            if (downloaded < HEADER_MIN_SIZE) {
                                displayPercent = Math.min(100, Math.floor((downloaded / HEADER_MIN_SIZE) * 100));
                            } else {
                                const fileSize = parseInt(data.total_size);
                                if (!fileSize) break;
                                displayPercent = Math.min(100, Math.floor((downloaded / fileSize) * 100));
                            }
                            // Update per-item progress bar for this hash
                            const item = c.querySelector(`.resolution-item[data-info-hash="${data.info_hash}"]`);
                            if (item) {
                                const fill = item.querySelector('.res-progress-fill');
                                const text = item.querySelector('.res-progress');
                                if (fill) {
                                    fill.style.width = displayPercent + '%';
                                    fill.classList.toggle('phase1', downloaded < HEADER_MIN_SIZE);
                                    fill.classList.toggle('phase2', downloaded >= HEADER_MIN_SIZE && displayPercent < 100);
                                    fill.classList.toggle('completed', displayPercent >= 100);
                                }
                                if (text) text.textContent = displayPercent + '%';
                            }
                            break;
                        }
                    }
                } else if (data.status === 'cancelled' && data.info_hash) {
                    const cards = document.querySelectorAll('.movie-card');
                    for (const c of cards) {
                        const item = c.querySelector(`.resolution-item[data-info-hash="${data.info_hash}"]`);
                        if (item) {
                            item.classList.remove('downloading');
                            const progEl = item.querySelector('.res-progress');

                                progEl.setAttribute('data-tooltip', data.cancel_reason || '');
                                progEl.style.color = '#ff4444';

                            const fill = item.querySelector('.res-progress-fill');
                            if (fill) {
                                fill.style.width = '0%';
                                fill.classList.remove('phase1', 'phase2', 'completed');
                            }
                            break;
                        }
                    }
                }
            } catch (e) {}
        }
        
        async function startTorrent(torrent, card) {
            const { info_hash, magnet, name } = torrent;

            try {
                const statusResp = await fetch('/api/status');
                const statusData = await statusResp.json();

                const tmdbMatch = !statusData.tmdb_id || !card.dataset.movieId || String(statusData.tmdb_id) === String(card.dataset.movieId);

                if (statusData.info_hash === info_hash && tmdbMatch) {
                    if (statusData.status === 'downloading') {
                        if (activeCard && activeCard !== card) {
                            activeCard.classList.remove('downloading', 'playable');
                        }
                        if (downloadPollInterval) clearInterval(downloadPollInterval);
                        activeCard = card;
                        card.classList.add('downloading');
                        downloadPollInterval = setInterval(() => checkDownload(card, info_hash), 2000);
                        return;
                    }
                    if (statusData.status === 'ready' || (statusData.status === 'idle' && statusData.file)) {
                        startPlayback(info_hash);
                        return;
                    }
                } else if (statusData.status === 'downloading' || statusData.status === 'ready') {
                    await cancelDownload();
                    await new Promise(r => setTimeout(r, 500));
                }
            } catch (e) {
                console.error('Status check error:', e);
            }

            if (activeCard && activeCard !== card) {
                activeCard.classList.remove('downloading', 'playable');
            }
            if (downloadPollInterval) {
                clearInterval(downloadPollInterval);
                downloadPollInterval = null;
            }
            isStreaming = false;

            activeCard = card;
            card.classList.add('downloading');

            try {
                const tmdbId = card.dataset.movieId || '';
                const resp = await fetch('/api/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ magnet, info_hash, name, tmdb_id: tmdbId })
                });

                if (!resp.ok) {
                    card.classList.remove('downloading');
                    activeCard = null;
                    return;
                }

                const libResp = await fetch('/api/downloads/list');
                libraryMovies = await libResp.json();
                enrichLibraryMovies();

                downloadPollInterval = setInterval(() => checkDownload(card, info_hash), 2000);

                const resItem = card.querySelector(`.resolution-item[data-info-hash="${info_hash}"]`);
                if (resItem) {
                    const listEl = card.querySelector('.resolution-list');
                    if (listEl) {
                        listEl.prepend(resItem);
                        listEl.scrollTop = 0;
                    }
                }
            } catch (e) {
                console.error('Fetch error:', e);
                card.classList.remove('downloading');
                activeCard = null;
            }
        }

        async function playMovie(movie, source, card) {
            let magnet, info_hash, name;

            const statusResp = await fetch('/api/status');
            const statusData = await statusResp.json();
            const activeItem = card.querySelector('.resolution-item');
            const cardInfoHash = activeItem ? activeItem.dataset.infoHash : '';
            const statusInfoHash = statusData.info_hash || '';
            const cardMovieId = card.dataset.movieId;
            const tmdbMatch = !statusData.tmdb_id || !cardMovieId || String(statusData.tmdb_id) === String(cardMovieId);

            if (cardInfoHash && statusInfoHash === cardInfoHash && tmdbMatch && (statusData.status === 'ready' || (statusData.status === 'idle' && statusData.file))) {
                startPlayback(cardInfoHash);
                return;
            }
            if (cardInfoHash && statusData.status === 'idle' && !statusData.info_hash) {
                startPlayback(cardInfoHash);
                return;
            }

            if (movie.magnet && movie.info_hash) {
                magnet = movie.magnet;
                info_hash = movie.info_hash;
                name = movie.name;
            } else if (source === 'apibay') {
                magnet = movie.magnet;
                info_hash = movie.info_hash;
                name = movie.name;
            } else {
                const query = movie.title;
                const year = movie.year || card.dataset.movieYear || '';
                const tmdbId = movie.id || '';
                const torrentResp = await fetch(`/api/torrent?q=${encodeURIComponent(query)}&category=${currentCategory}&year=${encodeURIComponent(year)}&tmdb_id=${encodeURIComponent(tmdbId)}`);
                if (!torrentResp.ok) return;
                const torrents = await torrentResp.json();
                if (torrents.length === 0) return;
                const best = torrents[0];
                magnet = best.magnet;
                info_hash = best.info_hash;
                name = best.name;
            }

            startTorrent({ info_hash, magnet, name }, card);
        }

        let isStreaming = false;
        
        async function checkDownload(card, expectedInfoHash) {
            if (!document.body.contains(card)) {
                if (downloadPollInterval) {
                    clearInterval(downloadPollInterval);
                    downloadPollInterval = null;
                }
                return;
            }

            const resp = await fetch('/api/status');
            const data = await resp.json();

            if (data.info_hash && expectedInfoHash && data.info_hash !== expectedInfoHash) {
                return;
            }

            const dlPlay = card.querySelector('.dl-play');

            if (data.status === 'ready') {
                card.classList.add('playable');
                dlPlay.classList.add('ready');

                // Update resolution list progress for this hash
                const readyItems = card.querySelectorAll(`.resolution-item[data-info-hash="${expectedInfoHash}"]`);
                readyItems.forEach(item => {
                    const progEl = item.querySelector('.res-progress');
                    if (progEl) progEl.textContent = '100%';
                    const fill = item.querySelector('.res-progress-fill');
                    if (fill) {
                        fill.style.width = '100%';
                        fill.classList.remove('phase1');
                        fill.classList.add('completed');
                    }
                    item.title = 'Ready to play';
                });

                const libResp = await fetch('/api/downloads/list');
                libraryMovies = await libResp.json();
                enrichLibraryMovies();

                if (downloadPollInterval) {
                    clearInterval(downloadPollInterval);
                    downloadPollInterval = null;
                }

                if (!isStreaming) {
                    isStreaming = true;
                    startPlayback(expectedInfoHash);
                }
            } else if (data.status === 'error') {
                if (downloadPollInterval) {
                    clearInterval(downloadPollInterval);
                    downloadPollInterval = null;
                }
            } else if (data.status === 'cancelled') {
                card.classList.remove('downloading', 'playable');
                if (downloadPollInterval) {
                    clearInterval(downloadPollInterval);
                    downloadPollInterval = null;
                }
                const dlItems = card.querySelectorAll(`.resolution-item[data-info-hash="${expectedInfoHash}"]`);
                dlItems.forEach(item => {
                    const progEl = item.querySelector('.res-progress');
                    if (progEl) {
                        progEl.textContent = 'Bad torrent';
                        progEl.setAttribute('data-tooltip', data.cancel_reason || '');
                        progEl.style.color = '#ff4444';
                    }
                    const fill = item.querySelector('.res-progress-fill');
                    if (fill) {
                        fill.style.width = '0%';
                        fill.classList.remove('phase1', 'phase2', 'completed');
                    }
                });
            } else if (data.downloaded_size !== undefined) {
                const downloaded = data.downloaded_size;
                const isValid = data.is_valid;

                let displayPercent;
                if (downloaded < HEADER_MIN_SIZE) {
                    displayPercent = Math.min(100, Math.floor((downloaded / HEADER_MIN_SIZE) * 100));
                } else {
                    const fileSize = parseInt(data.total_size);
                    if (!fileSize) return;
                    displayPercent = Math.min(100, Math.floor((downloaded / fileSize) * 100));
                }

                // Update resolution list progress for this hash
                const dlItems = card.querySelectorAll(`.resolution-item[data-info-hash="${expectedInfoHash}"]`);
                dlItems.forEach(item => {
                    const progEl = item.querySelector('.res-progress');
                    if (progEl) progEl.textContent = displayPercent + '%';
                    const fill = item.querySelector('.res-progress-fill');
                    if (fill) {
                        fill.style.width = displayPercent + '%';
                        fill.classList.toggle('phase1', downloaded < HEADER_MIN_SIZE);
                        fill.classList.toggle('completed', displayPercent >= 100);
                    }
                });

                // Check playable status via backend API (100MB + header ready)
                if (!isStreaming) {
                    const playableResp = await fetch('/api/download/playable');
                    const playableData = await playableResp.json();
                    if (playableData.playable && isValid) {
                        card.classList.add('playable');
                        isStreaming = true;
                        dlPlay.classList.add('ready');
                        startPlayback(expectedInfoHash);
                    }
                }
            }
        }

        function resolutionRank(res) {
            const rank = { '4K': 5, '2160p': 5, '1080p': 4, '720p': 3, '480p': 2, '360p': 1 };
            return rank[res] || 0;
        }

        async function startPlaybackFromCard(event) {
            const card = event.target.closest('.movie-card');
            if (!card) return;
            const activeItem = card.querySelector('.resolution-item');
            if (activeItem && activeItem.dataset.infoHash) {
                card.classList.add('playable');
                const btn = card.querySelector('.dl-play');
                if (btn) btn.classList.add('ready');
                startPlayback(activeItem.dataset.infoHash);
                return;
            }
            const movieId = parseInt(card.dataset.movieId);
            const entry = libraryMovies.find(m => m.id === movieId);
            if (entry && entry.resolutions && entry.resolutions.length > 0) {
                const complete = entry.resolutions.filter(r => r.is_playable && parseInt(r.progress) >= 100);
                let best;
                if (complete.length > 0) {
                    best = complete.sort((a, b) => resolutionRank(b.resolution) - resolutionRank(a.resolution))[0];
                } else {
                    best = entry.resolutions.sort((a, b) => {
                        const diff = (parseInt(b.progress) || 0) - (parseInt(a.progress) || 0);
                        if (diff !== 0) return diff;
                        const rDiff = resolutionRank(b.resolution) - resolutionRank(a.resolution);
                        if (rDiff !== 0) return rDiff;
                        return parseInt(b.seeders || 0) - parseInt(a.seeders || 0);
                    })[0];
                }
                if (best && best.info_hash) startPlayback(best.info_hash);
            }
        }
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
        }
        
        async function startPlayback(infoHash) {
            isStreaming = true;
            let card = null;
            const allCards = document.querySelectorAll('.movie-card');
            for (const c of allCards) {
                if (c.querySelector(`.resolution-item[data-info-hash="${infoHash}"]`)) {
                    card = c;
                    break;
                }
            }
            const tmdbId = card ? card.dataset.movieId : null;
            if (card) {
                if (activeCard && activeCard !== card) {
                    activeCard.classList.remove('downloading');
                    activeCard.classList.remove('playable');
                }
                activeCard = card;
                card.classList.add('downloading');
                if (downloadPollInterval) clearInterval(downloadPollInterval);
                downloadPollInterval = setInterval(() => checkDownload(card, infoHash), 2000);
            }

            try {
                const resp = await fetch('/api/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({info_hash: infoHash, tmdb_id: tmdbId})
                });
                const data = await resp.json();
                
                if (!resp.ok) {
                    showNotification(data.error, true);
                } else {
                    checkPlayable();
                }
            } catch (e) {
                showNotification('Playback error: ' + e.message, true);
            }
        }
        
        async function checkPlayable() {

        }

        // Search functionality
        let searchTimeout;
        
        function cancelCurrentSearch() {
            if (searchPollInterval) {
                clearInterval(searchPollInterval);
                searchPollInterval = null;
            }
            if (currentSearchId) {
                fetch('/api/search/cancel', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({search_id: currentSearchId})
                }).catch(() => {});
                currentSearchId = null;
            }
            searchResultsCache = [];
        }
        
        function pollSearchProgress() {
            if (!currentSearchId) return;
            
            searchPollInterval = setInterval(() => {
                fetch(`/api/search/progress?id=${currentSearchId}`)
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.cancelled) {
                            if (searchPollInterval) clearInterval(searchPollInterval);
                            searchPollInterval = null;
                            currentSearchId = null;
                            return;
                        }
                        
                        // Update cache with any new results
                        if (data.combined && data.combined.length > searchResultsCache.length) {
                            searchResultsCache = [...data.combined];
                        }
                        
                        // Calculate total pages from filtered results
                        let filteredCache = searchResultsCache;
                        if (currentGenre) {
                            const genreId = parseInt(currentGenre);
                            filteredCache = searchResultsCache.filter(m => !m.genre_ids || m.genre_ids.includes(genreId));
                        }
                        const MOVIES_PER_PAGE = 100;
                        currentTotalPages = Math.max(1, Math.ceil(filteredCache.length / MOVIES_PER_PAGE));
                        
                        // Enable next button only if more pages have been fetched
                        const nextBtn = document.getElementById('next-btn');
                        if (nextBtn) {
                            nextBtn.disabled = currentPage >= data.pages_fetched || currentPage >= currentTotalPages;
                        }
                        
                        // Update page info display
                        const pageInfo = document.getElementById('page-info');
                        if (pageInfo) {
                            pageInfo.textContent = `Page ${currentPage} of ${currentTotalPages}`;
                        }
                        
                        if (data.done) {
                            if (searchPollInterval) clearInterval(searchPollInterval);
                            searchPollInterval = null;
                            currentSearchId = null;
                        }
                    })
                    .catch(() => {});
            }, 500);
        }
        
        function performSearch(query, page = 1) {
            if (!query) {
                loadAll(page);
                return;
            }

            if (viewMode === 'downloaded') {
                let filtered = sortAndFilterMovies(libraryMovies, query);
                renderMovies(filtered, 'search');
                updatePagination(1);
                document.getElementById('movie-count').textContent = filtered.length.toLocaleString() + ' Downloaded Movies';
                return;
            }

            // Always show pagination
            const pagination = document.getElementById('pagination');
            pagination.style.display = 'flex';
            
            // Cancel any existing streaming search
            cancelCurrentSearch();
            
            if (!query) {
                loadAll(1);
                return;
            }
            
            currentSearchQuery = query;
            currentSource = 'search';
            
            // 1. Instant Local Search
            const queryLower = query.toLowerCase();
            const localMatches = displayMovies.filter(m => 
                (m.title || '').toLowerCase().includes(queryLower)
            );
            
            // Apply current filters to local matches
            const filteredLocal = sortAndFilterMovies(localMatches, query);
            
            const MOVIES_PER_PAGE = 100;
            const pageLocal = filteredLocal.slice(0, MOVIES_PER_PAGE);
            
            // Render local results immediately
            renderMovies(pageLocal, 'search');
            
            const totalLocalPages = Math.max(1, Math.ceil(filteredLocal.length / MOVIES_PER_PAGE));
            currentPage = 1;
            updatePagination(totalLocalPages);
            document.getElementById('movie-count').textContent = filteredLocal.length.toLocaleString() + ' of ' + totalDatabaseMovies.toLocaleString() + ' Movies';
            
            // 2. Background External Search
            const requestId = ++currentSearchRequestId;
            
            fetch(`/api/search?q=${encodeURIComponent(query)}&page=${page}&external_only=1&year=${encodeURIComponent(currentYear)}`)
                .then(resp => resp.json())
                .then(data => {
                    if (requestId !== currentSearchRequestId) return;
                    
                     const externalResults = data.combined || data.results || [];
                     
                     // Combine local and external results without deduplication
                     const finalResults = [...filteredLocal, ...externalResults];
                     
                     // Update cache for pagination

                    searchResultsCache = finalResults;
                    
                    const totalPages = Math.max(1, Math.ceil(finalResults.length / MOVIES_PER_PAGE));
                    currentTotalPages = totalPages;
                    
                    const pageResults = finalResults.slice(0, MOVIES_PER_PAGE);
                    renderMovies(pageResults, 'search');
                    updatePagination(totalPages);
                    
                    document.getElementById('movie-count').textContent = finalResults.length.toLocaleString() + ' of ' + totalDatabaseMovies.toLocaleString() + ' Movies';
                    
                    if (data.streaming && data.search_id) {
                        currentSearchId = data.search_id;
                        if (!data.done) {
                            pollSearchProgress();
                        }
                    }
                })
                .catch(err => console.error('Search error:', err));
        }
        
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            currentSearchQuery = query;
 
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                if (query.length < 2) {
                    cancelCurrentSearch();
                    applyCurrentView();
                    return;
                }
                applyCurrentView();
            }, 400);
        });

        
        async function openDownloadsFolder() {
            try {
                const resp = await fetch('/api/open-downloads', { method: 'POST' });
                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    console.error('Failed to open downloads folder:', err);
                }
            } catch (e) {
                console.error('Open downloads error:', e);
            }
        }
        // Initialize - loads movies and library data before rendering
        loadAll();
    </script>
</body>
</html>
